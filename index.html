      text-align: center;

    }
    button {
      background:#333; 
      color:#fff; 
      padding:10px 20px; 
      border:none;

      margin-top: 20px;
    }
    /* Botão de fechar dentro do menu */
    .closebtn {

      top: 20px;
      right: 25px;
      font-size: 30px;
      color: white;
      text-decoration: none;
    }
  </style>
</head>
