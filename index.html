<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesca Justa</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f0f8ff;
      color: #333;
    }
    <body>
  <header>
    <h1>Pesca Justa</h1>
    <button onclick="toggleMenu()" 
            style="background:#333; color:#fff; padding:10px 20px; border:none; cursor:pointer;">
      Menu
    </button>
  </header>

  <nav id="menu" style="opacity:0; max-height:0; overflow:hidden; transition:all 0.5s ease; background:#f0f0ff; padding:20px; text-align:center;">
    <a href="#" style="margin:10px; color:#333; text-decoration:none;">Início</a>
    <a href="#" style="margin:10px; color:#333; text-decoration:none;">Sobre</a>
    <a href="#" style="margin:10px; color:#333; text-decoration:none;">Contato</a>
  </nav>

  <script>
  function toggleMenu() {
    const menu = document.getElementById("menu");
    if (menu.style.opacity === "0" || menu.style.opacity === "") {
      menu.style.opacity = "1";
      menu.style.maxHeight = "200px";
    } else {
      menu.style.opacity = "0";
      menu.style.maxHeight = "0";
    }
  }
  </script>
</body>

    header {
      background: url('https://copilot.microsoft.com/th/id/BCO.74716dfa-c432-47a7-a1e9-36be88d6e4e6.png') no-repeat center center;
      background-size: cover;
      color: white;
      padding: 60px 20px;
      text-align: center;
    }
    nav {
      background: #004d66;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }
    section {
      padding: 40px;
      text-align: center;
    }
    section img {
      width: 45%;
      margin: 10px;
      border-radius: 8px;
    }
    footer {
      background: #006994;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Pesca Justa</h1>
    <p>Organize sua pesca embarcada</p>
  </header>
  <nav>
    <a href="#">Início</a>
    <a href="#">Sobre</a>
    <a href="#">Contato</a>
  </nav>
  <section>
    <h2>Bem-vindo ao Pesca Justa</h2>
    <p>Nosso objetivo é ajudar pescadores a organizar suas saídas de barco de forma prática e eficiente.</p>
    <div>
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6a/Fishing_boat.jpg" alt="Barco de pesca">
      <img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Fishermen_boat.jpg" alt="Pescadores no barco">
    </div>
  </section>
  <footer>
    <p>&copy; 2026 Pesca Justa</p>
  </footer>
</body>
</html>
