<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesca Justa</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f0f8ff;
      color: #333;
    }
    header {
      background: url('https://copilot.microsoft.com/th/id/BCO.74716dfa-c432-47a7-a1e9-36be88d6e4e6.png') no-repeat center center;
      background-size: cover;
      color: white;
      padding: 60px 20px;
      text-align: center;
    }
    nav {
      background: #004d66;
      text-align: center;
      transition: all 0.5s ease;
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      position: fixed;   /* FIXA no topo */
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;     /* garante que fique acima do conteúdo */
    }
    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
      display: inline-block;
      padding: 15px 0;
    }
    section {
      padding: 100px 40px 40px; /* espaço extra por causa do menu fixo */
      text-align: center;
    }
    section img {
      width: 45%;
      margin: 10px;
      border-radius: 8px;
    }
    footer {
      background: #006994;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 30px;
    }
    button {
      background:#333; 
      color:#fff; 
      padding:10px 20px; 
      border:none; 
      cursor:pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Pesca Justa</h1>
    <p>Organize sua pesca embarcada</p>
    <button onclick="toggleMenu()">Menu</button>
  </header>

  <nav id="menu">
    <a href="#">Início</a>
    <a href="#">Sobre</a>
    <a href="#">Contato</a>
  </nav>

  <section>
    <h2>Bem-vindo ao Pesca Justa</h2>
    <p>Nosso objetivo é ajudar pescadores a organizar suas saídas de barco de forma prática e eficiente.</p>
    <div>
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6a/Fishing_boat.jpg" alt="Barco de pesca">
      <img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Fishermen_boat.jpg" alt="Pescadores no barco">
    </div>
  </section>

  <footer>
    <p>&copy; 2026 Pesca Justa</p>
  </footer>

  <script>
    function toggleMenu() {
      const menu = document.getElementById("menu");
      if (menu.style.maxHeight === "0px" || menu.style.maxHeight === "") {
        menu.style.maxHeight = "200px";
        menu.style.opacity = "1";
      } else {
        menu.style.maxHeight = "0";
        menu.style.opacity = "0";
      }
    }
  </script>
</body>
</html>
